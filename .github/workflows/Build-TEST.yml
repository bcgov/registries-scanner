name: Build (TEST) - MSBuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    environment: TEST

    env:
      APP_CONFIG_DIR: RegScan
      SOLUTION_FILE: RegScan.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: "Any CPU"

    steps:
#1. Checkout Code
      - name: Checkout
        uses: actions/checkout@v4
#2. Add MSBuild to Path
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
#3. Setup Nuget
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
#4. Create sensitive.config for appSettings
      - name: Create sensitive.config for appSettings
        shell: pwsh
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HOST: ${{ secrets.HOST }}
          SID: ${{ secrets.SID }}
          AUTH_SVC_URL: ${{ secrets.AUTH_SVC_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_ACCOUNT: ${{ secrets.CLIENT_ACCOUNT }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          APIKEY: ${{ secrets.APIKEY }}
          API_URL: ${{ secrets.API_URL }}
          TwainSDKUserName: ${{ secrets.TwainSDKUserName }}
          TwainSDKEmail: ${{ secrets.TwainSDKEmail }}
          TwainSDKKey: ${{ secrets.TwainSDKKey }}
        run: |
          $required = @(
            'USERNAME','PASSWORD','HOST','SID','AUTH_SVC_URL','CLIENT_ID','CLIENT_ACCOUNT',
            'ACCOUNT_ID','APIKEY','API_URL','TwainSDKUserName','TwainSDKEmail','TwainSDKKey'
          )

          $missing = @()
          foreach ($k in $required) {
            $val = [System.Environment]::GetEnvironmentVariable($k)
            if ([string]::IsNullOrWhiteSpace($val)) { $missing += $k }
          }

          if ($missing.Count -gt 0) {
            throw "Missing required secrets in TEST environment: $($missing -join ', ')"
          }

          function XmlEscape([string]$s) {
            return [System.Security.SecurityElement]::Escape($s)
          }

          $content = @()
          $content += '<?xml version="1.0" encoding="utf-8"?>'
          $content += '<appSettings>'

          foreach ($k in $required) {
            $v = XmlEscape([System.Environment]::GetEnvironmentVariable($k))
            $content += "  <add key=`"$k`" value=`"$v`" />"
          }

          $content += '</appSettings>'

          $targetDir = Join-Path $env:GITHUB_WORKSPACE $env:APP_CONFIG_DIR
          $appConfig = Join-Path $targetDir 'app.config'

          if (!(Test-Path $appConfig)) {
            throw "app.config not found at $appConfig"
          }

          $outFile = Join-Path $targetDir 'sensitive.config'
          $content | Out-File -FilePath $outFile -Encoding utf8 -NoNewline

          Write-Host "sensitive.config created at $outFile"
#5. Restore NuGet packages
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "$env:SOLUTION_FILE"
#6. Build
      - name: Build with MSBuild
        shell: pwsh
        run: |
          msbuild "$env:SOLUTION_FILE" `
            /m `
            /t:Rebuild `
            /p:Configuration="$env:BUILD_CONFIGURATION" `
            /p:Platform="$env:BUILD_PLATFORM" `
            /verbosity:minimal
#7. Store files in folder for export
      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: full-build-output
          path: '*/bin/Debug/'  # Point to the directory, not a file
          retention-days: 5 
